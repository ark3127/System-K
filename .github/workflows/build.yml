name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing Android project files
        run: flutter create --platforms=android --org com.systemk --project-name system_k .

      - name: Get dependencies
        run: flutter pub get

      - name: Check everything is healthy
        run: flutter analyze

      - name: Build the APK
        run: flutter build apk --debug

      - name: Save the APK so we can download it
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
